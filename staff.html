<main class="page"><div class="page-title"><p class="eyebrow">DELIVERY OPERATIONS</p><h1>Staff update portal</h1><p>Delivery staff can add the latest parcel location and status.</p></div><div class="panel"><form id="updateForm"><div class="form-grid"><label>Parcel ID<input name="parcelId" required placeholder="Example: SS10001"></label><label>Current location<input name="location" required placeholder="e.g. Kurnool sorting centre"></label><label>Status<select name="status" required><option value="">Choose status</option><option>Booked</option><option>Picked Up</option><option>In Transit</option><option>Out for Delivery</option><option>Delivered</option><option>Delivery Attempted</option></select></label><label>Update note<input name="note" placeholder="Optional delivery note"></label></div><button class="btn primary">Save tracking update</button><p id="updateMessage" class="message"></p></form></div><div class="table-wrap"><h2>Recent tracking updates</h2><table><thead><tr><th>Parcel ID</th><th>Location</th><th>Status</th><th>Updated</th></tr></thead><tbody id="updatesTable"></tbody></table></div></main>
