<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Parcel | SwiftShip</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">S</span> SwiftShip</a><nav><a href="index.html">Home</a><a class="active" href="book.html">Book Parcel</a><a href="track.html">Track Parcel</a><a href="customers.html">Customers</a><a href="staff.html">Staff Portal</a><a href="payments.html">Payments</a></nav></header>
<main class="page"><div class="page-title"><p class="eyebrow">NEW SHIPMENT</p><h1>Book a parcel</h1><p>Fill in the sender, receiver, and parcel details to create a booking.</p></div>
<div class="panel"><form id="bookingForm"><h2>Sender details</h2><div class="form-grid"><label>Sender name<input name="senderName" required placeholder="Full name"></label><label>Sender email<input name="email" type="email" required placeholder="name@example.com"></label><label>Sender phone<input name="phone" required placeholder="Phone number"></label><label>Sender address<input name="senderAddress" required placeholder="Pickup address"></label></div><h2>Receiver details</h2><div class="form-grid"><label>Receiver name<input name="receiverName" required placeholder="Full name"></label><label>Receiver phone<input name="receiverPhone" required placeholder="Phone number"></label><label class="wide">Receiver address<input name="receiverAddress" required placeholder="Delivery address"></label></div><h2>Parcel details</h2><div class="form-grid"><label>Weight (kg)<input name="weight" type="number" min="0.1" step="0.1" required placeholder="e.g. 2.5"></label><label>Booking date<input name="bookingDate" type="date" required></label></div><button class="btn primary" type="submit">Create booking</button><p id="bookingMessage" class="message" aria-live="polite"></p></form></div></main>
<footer>© 2026 SwiftShip Courier Services <span>Simple • Secure • Trackable</span></footer><script src="app.js"></script></body></html>
