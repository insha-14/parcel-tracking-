<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | SwiftShip</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">S</span> SwiftShip</a><nav><a href="index.html">Home</a><a href="book.html">Book Parcel</a><a href="track.html">Track Parcel</a><a href="customers.html">Customers</a><a href="staff.html">Staff Portal</a><a class="active" href="payments.html">Payments</a></nav></header>
<main class="page"><div class="page-title"><p class="eyebrow">BILLING</p><h1>Payment records</h1><p>Record a parcel payment and keep its payment status updated.</p></div><div class="panel"><form id="paymentForm"><div class="form-grid"><label>Parcel ID<input name="parcelId" required placeholder="Example: SS10001"></label><label>Amount (₹)<input name="amount" type="number" min="1" step="0.01" required placeholder="e.g. 250"></label><label>Payment method<select name="method" required><option value="">Choose method</option><option>Cash</option><option>UPI</option><option>Card</option><option>Net Banking</option></select></label><label>Payment status<select name="status" required><option>Pending</option><option>Paid</option><option>Failed</option></select></label></div><button class="btn primary">Save payment</button><p id="paymentMessage" class="message"></p></form></div><div class="table-wrap"><h2>Payment history</h2><table><thead><tr><th>Payment ID</th><th>Parcel ID</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead><tbody id="paymentsTable"></tbody></table></div></main>
<footer>© 2026 SwiftShip Courier Services <span>Simple • Secure • Trackable</span></footer><script src="app.js"></script></body></html>
